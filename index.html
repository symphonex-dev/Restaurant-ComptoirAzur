<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
         SEO — balises essentielles pour le référencement.
         Un site vitrine de restaurant vit ou meurt sur sa visibilité
         locale : title + description doivent contenir la ville et le
         type de cuisine, c'est ce que les gens tapent sur Google.
    ============================================================= -->
    <title>Le Comptoir d'Azur — Restaurant méditerranéen à Nice</title>
    <meta
      name="description"
      content="Le Comptoir d'Azur, restaurant gastronomique méditerranéen au cœur du Vieux-Nice. Produits de la mer, saveurs provençales et terrasse face au soleil. Réservez votre table."
    />
    <meta name="theme-color" content="#1B2420" />

    <!-- Open Graph — pour un aperçu soigné quand le lien est partagé -->
    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:title" content="Le Comptoir d'Azur — Restaurant méditerranéen à Nice" />
    <meta
      property="og:description"
      content="Cuisine méditerranéenne raffinée, produits de la mer et terrasse ensoleillée au cœur du Vieux-Nice."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1756680967373-c3205a8a8b31?w=1200&q=80&auto=format&fit=crop"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ============================================================
         Polices : Cormorant Garamond (display, élégant et contrasté)
         + Jost (texte courant, géométrique et sobre). On charge
         uniquement les graisses utilisées pour ne pas alourdir le
         chargement.
    ============================================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
